<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Finanzas Personales</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Titulo -->
        <header class="text-center">
            <h1 class="text-3xl font-bold text-slate-900">Gestor de Finanzas Personales</h1>
            <p class="text-sm text-slate-500">Controla tus ingresos y gastos diarios</p>
        </header>
        
        <!-- Panel de balnce -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Ingresos -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-medium text-slate-500">Ingresos Totales</h3>
                <p id="total-ingresos" class="text-2xl font-bold text-emerald-600">$0.00</p>
            </div>
       <!--  Gastos -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-medium text-slate-500">Gastos Totales</h3>
                <p id="total-gastos" class="text-2xl font-bold text-rose-600">$0.00</p>
            </div>
            <!-- Balance Neto -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-medium text-slate-500">Balance Neto</h3>
                <p id="balance-neto" class="text-2xl font-bold text-slate-900">$0.00</p>
            </div>
        </section>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </div>

    
</body>
</html>
